<h2>Retrieve the S7 class of an object</h2>

<h3>Description</h3>

<p>Given an S7 object, find it's class.
</p>


<h3>Usage</h3>

<pre>
S7_class(object)
</pre>


<h3>Arguments</h3>

<table summary="R argblock">
<tr valign="top"><td><code>object</code></td>
<td>
<p>The S7 object</p>
</td></tr>
</table>


<h3>Value</h3>

<p>An <a href="../../S7/help/new_class.html">S7 class</a>.
</p>


<h3>Examples</h3>

<pre>
Foo &lt;- new_class("Foo")
S7_class(Foo())
</pre>
