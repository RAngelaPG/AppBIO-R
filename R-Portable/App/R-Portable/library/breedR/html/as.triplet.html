<h2>Represent a symmetric matrix in triplet format</h2>

<h3>Description</h3>

<p>It only gives the lower triangular elements, and **do not** check for
symmetry.
</p>


<h3>Usage</h3>

<pre>
as.triplet(x)
</pre>
