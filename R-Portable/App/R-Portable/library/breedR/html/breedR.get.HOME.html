<h2>Determine the user's home directory</h2>

<h3>Description</h3>

<p>Relies on <code>Sys.getenv('HOME')</code>, or under windows, on
<code>Sys.getenv("USERPROFILE"))</code> changing backslashes to slashes.
</p>


<h3>Usage</h3>

<pre>
breedR.get.HOME()
</pre>
