<h2>Get names of effects</h2>

<h3>Description</h3>

<p>Give the names of the (components) of the effects
in a breedr_modelframe. Internal function. Not exported.
</p>


<h3>Usage</h3>

<pre>
get_efnames(effects)
</pre>
