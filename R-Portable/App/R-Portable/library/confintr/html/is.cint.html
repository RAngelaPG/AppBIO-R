<h2>Type Check</h2>

<h3>Description</h3>

<p>Checks if an object inherits class &quot;cint&quot;.
</p>


<h3>Usage</h3>

<pre>
is.cint(x)
</pre>


<h3>Arguments</h3>

<table summary="R argblock">
<tr valign="top"><td><code>x</code></td>
<td>
<p>Any object.</p>
</td></tr>
</table>


<h3>Value</h3>

<p>A logical vector of length one.
</p>


<h3>Examples</h3>

<pre>
is.cint(ci_proportion(5, 20))
is.cint(c(1, 2))
</pre>
