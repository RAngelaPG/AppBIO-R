<h2>Calculate the entropy</h2>

<h3>Description</h3>

<p>Calculate the Shannon's entropy.
</p>


<h3>Usage</h3>

<pre>
entropy(x)
</pre>


<h3>Arguments</h3>

<table summary="R argblock">
<tr valign="top"><td><code>x</code></td>
<td>
<p>a numeric vector.</p>
</td></tr>
</table>


<h3>Value</h3>

<p>numeric. entropy
</p>


<h3>Examples</h3>

<pre>
set.seed(123)
x &lt;- sample(1:10, 20, replace = TRUE)

entropy(x)

</pre>
