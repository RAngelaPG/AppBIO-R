<h2>Finding Users Machine's OS</h2>

<h3>Description</h3>

<p>Get the operating system that users machines.
</p>


<h3>Usage</h3>

<pre>
get_os()
</pre>


<h3>Value</h3>

<p>OS names. &quot;windows&quot; or &quot;osx&quot; or &quot;linux&quot;
</p>


<h3>Examples</h3>

<pre>
get_os()

</pre>
