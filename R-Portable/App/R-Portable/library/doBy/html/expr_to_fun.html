<h2>Convert expression into function object.</h2>

<h3>Description</h3>

<p>Convert expression into function object.
</p>


<h3>Usage</h3>

<pre>
expr_to_fun(e)
</pre>


<h3>Arguments</h3>

<table summary="R argblock">
<tr valign="top"><td><code>e</code></td>
<td>
<p>expression</p>
</td></tr>
</table>


<h3>Examples</h3>

<pre>

ee &lt;- expression(b1 + (b0 - b1)*exp(-k*x) + b2*x)
ff &lt;- expr_to_fun(ee)
</pre>
