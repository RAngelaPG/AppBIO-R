<h2>Box Output</h2>

<h3>Description</h3>

<p>Place box output in Shiny ui.
</p>


<h3>Usage</h3>

<pre>
echarts4rBoxOutput(id, height = 150)
</pre>


<h3>Arguments</h3>

<table summary="R argblock">
<tr valign="top"><td><code>id</code></td>
<td>
<p>Id of box.</p>
</td></tr>
<tr valign="top"><td><code>height</code></td>
<td>
<p>Height of box, any valid CSS value, numerics are treated as pixels.</p>
</td></tr>
