<h2>Convert well-known binary to hex</h2>

<h3>Description</h3>

<p>Convert well-known binary to hex
</p>


<h3>Usage</h3>

<pre>
wkb_to_hex(x)
</pre>


<h3>Arguments</h3>

<table summary="R argblock">
<tr valign="top"><td><code>x</code></td>
<td>
<p>A <code><a href="../../wk/help/wkb.html">wkb()</a></code> vector</p>
</td></tr>
</table>


<h3>Value</h3>

<p>A hex encoded <code><a href="../../wk/help/wkb.html">wkb()</a></code> vector
</p>


<h3>Examples</h3>

<pre>
x &lt;- as_wkb(xyz(1:5, 6:10, 11:15))
wkb_to_hex(x)

</pre>
